name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [qa, test, staging] # Define environments to test against

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Set environment-specific URLs
      - name: Set environment variables
        run: |
          if [ "${{ matrix.environment }}" == "qa" ]; then
            echo "BASEURL=http://qa.example.com" >> $GITHUB_ENV
          elif [ "${{ matrix.environment }}" == "test" ]; then
            echo "BASEURL=http://test.example.com" >> $GITHUB_ENV
          elif [ "${{ matrix.environment }}" == "staging" ]; then
            echo "BASEURL=http://staging.example.com" >> $GITHUB_ENV
          fi

      # Run Playwright tests
      - name: Run Playwright tests
        env:
          environment: ${{ matrix.environment }} # Pass the environment variable
        run: |
          echo "Running tests for environment: ${{ matrix.environment }}"
          echo "Base URL: $BASEURL"
          npx playwright test --headed --workers 1 --project=chromium --grep @smoke
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
